<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM XSS Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      .box { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; max-width: 620px; }
      code { background: #f6f8fa; padding: 0.2rem 0.4rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>DOM XSS test</h1>
      <p>Try a URL like <code>/dom-demo?id=&lt;script&gt;alert('DOM-based')&lt;/script&gt;</code></p>
      <div id="user-name">Loading...</div>
    </div>

    <script>
      async function renderDemo() {
        const params = new URLSearchParams(window.location.search);
        const userId = params.get("id") || "guest";
        const response = await fetch("/api/health");
        const { mode } = await response.json();
        const target = document.getElementById("user-name");

        if (mode === "vulnerable") {
          target.innerHTML = userId;
        } else {
          target.textContent = userId;
        }
      }

      renderDemo();
    </script>
  </body>
</html>
